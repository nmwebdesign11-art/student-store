<body>


<div class="container">

  <h1>🛒 متجر الطلاب</h1>


  <div
    id="loading"
    class="status"
  >
    جاري تحميل المنتجات...

  <button onclick="startScanner()">
    📷 مسح الباركود
  </button>


  <div id="reader"></div>

      <span id="total">
        0
      </span>

    </div>


    <button
      class="invoice-button"
      onclick="createInvoice()"
    >
      🧾 إصدار الفاتورة
    </button>

<script>


/* =====================================
   رابط Google Apps Script
===================================== */

const PRODUCTS_URL =
  "https://script.google.com/macros/s/AKfycbxdnSfXqUNxR3QVwUxdCxxWfY9V9ZNssXV8UsQnplTJP7JFJDzBKMTAvhkDI1WHDckv/exec";

/*
 * مهم:
 * إذا كان الرابط أعلاه مختلفًا عن رابط
 * Web App الموجود عندك، استخدم رابط
 * Web App الحالي الموجود في Deployment.
 */


/* =====================================
   المتغيرات
===================================== */

let scanner = null;

let cart = [];

let products = {};


/* =====================================
   تحميل المنتجات
===================================== */

async function loadProducts() {

  try {

    const response =
      await fetch(PRODUCTS_URL);


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        "تعذر تحميل المنتجات"
      );

    }


    products = {};


    result.products.forEach(
      function(product) {

        const number =
          parseInt(
            product.barcode,
            10
          );


        if (isNaN(number)) {

          return;

        }


        const barcode =
          String(number)
            .padStart(3, "0");


        products[barcode] = {

          name:
            product.name,

          price:
            Number(product.price),

          stock:
            Number(product.stock)

        };

      }
    );


    document.getElementById(
      "loading"
    ).innerHTML =

      "✅ تم تحميل المنتجات: " +
      result.products.length;

  }


  catch (error) {

    console.error(error);


    document.getElementById(
      "loading"
    ).innerHTML =

      "❌ تعذر تحميل المنتجات";

  }

}


loadProducts();


/* =====================================
   تشغيل الكاميرا
===================================== */

async function startScanner() {


  if (
    Object.keys(products).length === 0
  ) {

    alert(
      "لم يتم تحميل المنتجات بعد"
    );

    return;

  }


  document.getElementById(
    "result"
  ).innerHTML =

    "📷 جاري تشغيل الكاميرا...";


  if (scanner) {

    try {

      await scanner.stop();

    }

    catch (e) {}

  }


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 150
      }
    },

    async function(decodedText) {


      addProduct(decodedText);


      try {

        await scanner.stop();

      }

      catch (e) {

        console.log(e);

      }


      document.getElementById(
        "reader"
      ).innerHTML = "";

    },

    function(errorMessage) {

      // تجاهل أخطاء القراءة المؤقتة

    }

  ).catch(function(error) {

    console.error(error);

    document.getElementById(
      "result"
    ).innerHTML =

      "❌ لم نستطع تشغيل الكاميرا";

  });

}


/* =====================================
   إضافة المنتج
===================================== */

function addProduct(barcode) {


  const number =
    parseInt(
      String(barcode).trim(),
      10
    );


  if (isNaN(number)) {

    document.getElementById(
      "result"
    ).innerHTML =

      "❌ باركود غير صالح";

    return;

  }


  /*
   * 1  → 001
   * 2  → 002
   * 3  → 003
   */

  const normalizedBarcode =
    String(number)
      .padStart(3, "0");


  const product =
    products[normalizedBarcode];


  if (!product) {

    document.getElementById(
      "result"
    ).innerHTML =

      "❌ هذا الباركود غير مسجل<br><br>" +

      "الباركود: <strong>" +

      normalizedBarcode +

      "</strong>";

    return;

  }


  const existing =
    cart.find(
      function(item) {

        return (
          item.barcode ===
          normalizedBarcode
        );

      }
    );


  if (existing) {

    existing.quantity++;

  }

  else {

    cart.push({

      barcode:
        normalizedBarcode,

      name:
        product.name,

      price:
        product.price,

      quantity:
        1

    });

  }


  document.getElementById(
    "result"
  ).innerHTML =

    "✅ تمت إضافة " +

    product.name;


  showCart();

}


/* =====================================
   حذف منتج
===================================== */

function deleteProduct(index) {

  cart.splice(index, 1);

  showCart();

}


/* =====================================
   تغيير الكمية
===================================== */

function changeQuantity(
  index,
  amount
) {


  if (!cart[index]) {

    return;

  }


  cart[index].quantity +=
    amount;


  if (
    cart[index].quantity <= 0
  ) {

    cart.splice(index, 1);

  }


  showCart();

}


/* =====================================
   عرض السلة
===================================== */

function showCart() {


  const container =
    document.getElementById(
      "cartItems"
    );


  if (cart.length === 0) {

    container.innerHTML =
      "لا توجد منتجات";


    document.getElementById(
      "total"
    ).innerText =
      "0";


    return;

  }


  let html = "";

  let total = 0;


  cart.forEach(
    function(item, index) {


      const itemTotal =
        item.price *
        item.quantity;


      total +=
        itemTotal;


      html += `

        <div class="item">

          <strong>
            ${item.name}
          </strong>

          <br><br>

          السعر:
          ${item.price}

          <br><br>

          الكمية:

          <button
            onclick="changeQuantity(
              ${index},
              -1
            )"
          >
            −
          </button>

          ${item.quantity}

          <button
            onclick="changeQuantity(
              ${index},
              1
            )"
          >
            +
          </button>

          <br><br>

          مجموع المنتج:
          <strong>
            ${itemTotal}
          </strong>

          <br>

          <button
            class="delete"
            onclick="deleteProduct(
              ${index}
            )"
          >
            🗑️ حذف
          </button>

        </div>

      `;

    }
  );


  container.innerHTML =
    html;


  document.getElementById(
    "total"
  ).innerText =
    total;

}


/* =====================================
   إصدار وحفظ الفاتورة
===================================== */

function createInvoice() {


  if (cart.length === 0) {

    alert(
      "السلة فارغة"
    );

    return;

  }


  const invoiceNumber =
    Date.now();


  const now =
    new Date();


  const date =
    now.toLocaleDateString("ar");


  const time =
    now.toLocaleTimeString("ar");


  let total = 0;

  let rows = [];


  const productNames = [];

  const quantities = [];


  cart.forEach(
    function(item) {


      const itemTotal =
        item.price *
        item.quantity;


      total +=
        itemTotal;


      productNames.push(
        item.name
      );


      quantities.push(
        item.quantity
      );


      rows.push(`

        <tr>

          <td>
            ${item.name}
          </td>

          <td>
            ${item.quantity}
          </td>

          <td>
            ${item.price}
          </td>

          <td>
            ${itemTotal}
          </td>

        </tr>

      `);

    }
  );


  /*
   * بيانات الفاتورة
   */

  const invoiceData = {

    invoiceNumber:
      invoiceNumber,

    date:
      date,

    products:
      productNames.join("، "),

    quantities:
      quantities.join("، "),

    total:
      total,

    time:
      time

  };


  /*
   * عرض الفاتورة
   */

  document.getElementById(
    "invoice"
  ).innerHTML = `

    <div class="invoice-box">

      <h2>
        🧾 فاتورة شراء
      </h2>

      <p>
        رقم الفاتورة:
        <strong>
          ${invoiceNumber}
        </strong>
      </p>

      <p>
        التاريخ:
        ${date}
      </p>

      <p>
        الوقت:
        ${time}
      </p>


      <table>

        <tr>

          <th>
            المنتج
          </th>

          <th>
            الكمية
          </th>

          <th>
            السعر
          </th>

          <th>
            المجموع
          </th>

        </tr>

        ${rows.join("")}

      </table>


      <h2>
        المجموع النهائي:
        ${total}
      </h2>


      <div
        id="saveStatus"
        class="status"
      >
        ⏳ جاري حفظ الفاتورة...
      </div>


      <button
        class="print-button"
        onclick="window.print()"
      >
        🖨️ طباعة الفاتورة
      </button>

    </div>

  `;


  /*
   * بناء رابط الحفظ
   */

  const params =
    new URLSearchParams();


  params.append(
    "action",
    "saveInvoice"
  );


  params.append(
    "invoiceNumber",
    invoiceNumber
  );


  params.append(
    "date",
    date
  );


  params.append(
    "products",
    productNames.join("، ")
  );


  params.append(
    "quantities",
    quantities.join("، ")
  );


  params.append(
    "total",
    total
  );


  params.append(
    "time",
    time
  );


  const saveUrl =
    PRODUCTS_URL +
    "?" +
    params.toString();


  /*
   * إرسال طلب الحفظ.
   *
   * لا نستخدم fetch هنا.
   * نفتح الطلب كصورة مخفية حتى لا
   * يمنعه المتصفح من الصفحة.
   */

  const saveRequest =
    document.createElement(
      "img"
    );


  saveRequest.style.display =
    "none";


  saveRequest.src =
    saveUrl;


  document.body.appendChild(
    saveRequest
  );


  /*
   * نعطي Apps Script وقتًا لمعالجة
   * الطلب ثم نعرض رسالة نجاح.
   */

  setTimeout(
    function() {

      document.getElementById(
        "saveStatus"
      ).innerHTML =

        "✅ تم إرسال الفاتورة للحفظ";

      saveRequest.remove();

    },
    2500
  );

}


</script>


</body>

</html>
