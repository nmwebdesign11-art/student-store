<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>متجر الطلاب</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      margin: 5px;
    }

    button:active {
      transform: scale(0.97);
    }

    .delete {
      background: #c62828;
    }

    .invoice-button {
      background: #1769aa;
      width: 100%;
      margin-top: 20px;
    }

    .print-button {
      width: 100%;
      margin-top: 20px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      font-size: 19px;
    }

    .cart {
      margin-top: 25px;
      text-align: right;
    }

    .item {
      border-bottom: 1px solid #ddd;
      padding: 15px 5px;
    }

    .total {
      font-size: 24px;
      font-weight: bold;
      margin-top: 20px;
    }

    #invoice {
      margin-top: 25px;
      text-align: right;
    }

    .invoice-box {
      border: 2px solid #222;
      border-radius: 15px;
      padding: 20px;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    .status {
      font-weight: bold;
      margin: 10px 0;
    }

    @media print {

      body {
        background: white;
        padding: 0;
      }

      body > .container {
        display: none;
      }

      #invoice {
        display: block;
      }

      .print-button {
        display: none;
      }

    }

  </style>

</head>


<body>


<div class="container">

  <h1>🛒 متجر الطلاب</h1>


  <div
    id="loading"
    class="status"
  >
    جاري تحميل المنتجات...
  </div>


  <button onclick="startScanner()">

    📷 مسح الباركود

  </button>


  <div id="reader"></div>


  <div id="result">

    اضغط على زر مسح الباركود

  </div>


  <div class="cart">

    <h2>🛒 السلة</h2>


    <div id="cartItems">

      لا توجد منتجات

    </div>


    <div class="total">

      المجموع:

      <span id="total">0</span>

    </div>


    <button
      class="invoice-button"
      onclick="createInvoice()"
    >

      🧾 إصدار الفاتورة

    </button>


    <div id="invoice"></div>

  </div>

</div>


<script>


/* =====================================
   رابط Google Apps Script
===================================== */

const PRODUCTS_URL =
  "https://script.google.com/macros/s/AKfycbxdnSfXqUNxR3QVwUxdCxxWfY9V9ZNssXV8UsQnplTJP7JFJDzBKMTAvhkDI1WHDckv/exec";


/* =====================================
   المتغيرات
===================================== */

let scanner = null;

let cart = [];

let products = {};


/* =====================================
   تحميل المنتجات
===================================== */

async function loadProducts() {

  try {

    const response =
      await fetch(PRODUCTS_URL);


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    products = {};


    data.forEach(function(product) {

      const barcode =
        String(product.barcode).trim();


      products[barcode] = {

        name: product.name,

        price: Number(product.price),

        stock: Number(product.stock)

      };

    });


    document.getElementById("loading").innerHTML =

      "✅ تم تحميل المنتجات: " +
      data.length;


  }

  catch (error) {

    console.error(error);


    document.getElementById("loading").innerHTML =

      "❌ تعذر تحميل المنتجات";


    document.getElementById("result").innerHTML =

      "تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.";

  }

}


/* تشغيل تحميل المنتجات */

loadProducts();



/* =====================================
   تشغيل الكاميرا
===================================== */

async function startScanner() {


  if (Object.keys(products).length === 0) {

    alert(
      "لم يتم تحميل المنتجات بعد"
    );

    return;

  }


  document.getElementById("result").innerHTML =

    "📷 جاري تشغيل الكاميرا...";


  if (scanner) {

    try {

      await scanner.stop();

    }

    catch (e) {

      // لا شيء

    }

  }


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 150
      }
    },


    async function(decodedText) {


      await addProduct(decodedText);


      try {

        await scanner.stop();

      }

      catch (e) {

        // لا شيء

      }


      document.getElementById("reader").innerHTML = "";

    },


    function(errorMessage) {

      // تجاهل أخطاء القراءة المؤقتة

    }

  )


  .catch(function(error) {

    console.error(error);


    document.getElementById("result").innerHTML =

      "❌ لم نستطع تشغيل الكاميرا";

  });

}



/* =====================================
   إضافة المنتج للسلة
===================================== */

function addProduct(barcode) {


  barcode =
    String(barcode).trim();


  const product =
    products[barcode];


  if (!product) {

    document.getElementById("result").innerHTML =

      "❌ هذا الباركود غير مسجل<br><br>" +

      "الباركود: <strong>" +

      barcode +

      "</strong>";

    return;

  }


  const existing =
    cart.find(function(item) {

      return item.barcode === barcode;

    });


  if (existing) {

    existing.quantity++;

  }

  else {

    cart.push({

      barcode: barcode,

      name: product.name,

      price: product.price,

      quantity: 1

    });

  }


  document.getElementById("result").innerHTML =

    "✅ تمت إضافة <strong>" +

    product.name +

    "</strong>";


  showCart();

}



/* =====================================
   حذف منتج
===================================== */

function deleteProduct(index) {

  cart.splice(index, 1);

  showCart();

}



/* =====================================
   تغيير الكمية
===================================== */

function changeQuantity(index, amount) {


  if (!cart[index]) {

    return;

  }


  cart[index].quantity += amount;


  if (cart[index].quantity <= 0) {

    cart.splice(index, 1);

  }


  showCart();

}



/* =====================================
   عرض السلة
===================================== */

function showCart() {


  const container =
    document.getElementById("cartItems");


  if (cart.length === 0) {

    container.innerHTML =
      "لا توجد منتجات";


    document.getElementById("total").innerText =
      "0";


    return;

  }


  let html = "";

  let total = 0;


  cart.forEach(function(item, index) {


    const itemTotal =
      item.price * item.quantity;


    total += itemTotal;


    html += `

      <div class="item">

        <strong>
          ${item.name}
        </strong>

        <br><br>

        الباركود:
        ${item.barcode}

        <br><br>

        السعر:
        ${item.price}

        <br><br>

        الكمية:

        <button
          onclick="changeQuantity(${index}, -1)"
        >
          −
        </button>

        ${item.quantity}

        <button
          onclick="changeQuantity(${index}, 1)"
        >
          +
        </button>

        <br><br>

        مجموع المنتج:
        <strong>${itemTotal}</strong>

        <br>

        <button
          class="delete"
          onclick="deleteProduct(${index})"
        >

          🗑️ حذف

        </button>

      </div>

    `;

  });


  container.innerHTML =
    html;


  document.getElementById("total").innerText =
    total;

}



/* =====================================
   إصدار وحفظ الفاتورة
===================================== */

async function createInvoice() {


  if (cart.length === 0) {

    alert("السلة فارغة");

    return;

  }


  const invoiceNumber =
    Date.now();


  const now =
    new Date();


  const date =
    now.toLocaleDateString("ar");


  const time =
    now.toLocaleTimeString("ar");


  let total = 0;

  let rows = [];


  const productNames = [];

  const quantities = [];


  cart.forEach(function(item) {


    const itemTotal =
      item.price *
      item.quantity;


    total += itemTotal;


    productNames.push(
      item.name
    );


    quantities.push(
      item.quantity
    );


    rows.push(`

      <tr>

        <td>
          ${item.name}
        </td>

        <td>
          ${item.quantity}
        </td>

        <td>
          ${item.price}
        </td>

        <td>
          ${itemTotal}
        </td>

      </tr>

    `);

  });


  const invoiceData = {

    invoiceNumber:
      invoiceNumber,

    date:
      date,

    products:
      productNames.join("، "),

    quantities:
      quantities.join("، "),

    total:
      total,

    time:
      time

  };


  document.getElementById("invoice").innerHTML = `

    <div class="invoice-box">

      <h2>
        🧾 جاري حفظ الفاتورة...
      </h2>

    </div>

  `;


  try {


    await fetch(

      PRODUCTS_URL,

      {

        method: "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(
            invoiceData
          )

      }

    );


    let invoiceRows =
      rows.join("");


    document.getElementById("invoice").innerHTML = `

      <div class="invoice-box">

        <h2>
          🧾 فاتورة شراء
        </h2>


        <p>

          رقم الفاتورة:

          <strong>
            ${invoiceNumber}
          </strong>

        </p>


        <p>

          التاريخ:
          ${date}

        </p>


        <p>

          الوقت:
          ${time}

        </p>


        <table>

          <tr>

            <th>
              المنتج
            </th>

            <th>
              الكمية
            </th>

            <th>
              السعر
            </th>

            <th>
              المجموع
            </th>

          </tr>


          ${invoiceRows}

        </table>


        <h2>

          المجموع النهائي:
          ${total}

        </h2>


        <p>

          ✅ تم إصدار الفاتورة

        </p>


        <button
          class="print-button"
          onclick="window.print()"
        >

          🖨️ طباعة الفاتورة

        </button>

      </div>

    `;


  }

  catch (error) {


    console.error(error);


    document.getElementById("invoice").innerHTML = `

      <div class="invoice-box">

        <h2>
          🧾 الفاتورة
        </h2>


        <p>

          ⚠️ تم إنشاء الفاتورة،
          لكن تعذر حفظها في Google Sheets.

        </p>


        <p>

          الخطأ:
          ${error}

        </p>

      </div>

    `;

  }

}

</script>


</body>

</html>
