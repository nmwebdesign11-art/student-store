<body>


<div class="container">

  <h1>🛒 متجر الطلاب</h1>


  <p id="loading" class="status">
    جاري تحميل المنتجات...
  </p>


  <button onclick="startScanner()">
    📷 مسح الباركود
  </button>


  <div id="reader"></div>


  <div id="result">
    اضغط على زر مسح الباركود
  </div>


  <div class="cart">

    <h2>🛒 السلة</h2>


    <div id="cartItems">
      لا توجد منتجات
    </div>


    <div class="total">

      المجموع:

      <span id="total">
        0
      </span>

    </div>


    <button
      class="invoice-button"
      onclick="createInvoice()"
    >
      🧾 إصدار الفاتورة
    </button>


    <div id="invoice"></div>

  </div>

</div>


<script>


/* =========================================
   رابط Google Apps Script
========================================= */

const PRODUCTS_URL =
  "https://script.google.com/macros/s/AKfycbxdnSfXqUNxR3QVwUxdCxxWfY9V9ZNssXV8UsQnplTJP7JFJDzBKMTAvhkDI1WHDckv/exec";


/* =========================================
   المتغيرات
========================================= */

let scanner = null;

let cart = [];

let products = {};


/* =========================================
   تحميل المنتجات
========================================= */

async function loadProducts() {

  try {

    const response =
      await fetch(PRODUCTS_URL);


    if (!response.ok) {

      throw new Error(
        "تعذر الاتصال بـ Google Apps Script"
      );

    }


    const data =
      await response.json();


    /*
     * Apps Script يعيد مصفوفة المنتجات
     */

    if (!Array.isArray(data)) {

      throw new Error(
        data.error ||
        "بيانات المنتجات غير صحيحة"
      );

    }


    products = {};


    data.forEach(function(product) {


      /*
       * جدول الشيت:
       *
       * 1 = قلم
       * 2 = ممحاة
       * 3 = دفتر
       *
       * نحولها إلى:
       *
       * 001
       * 002
       * 003
       */

      const productNumber =
        parseInt(
          product.barcode,
          10
        );


      if (isNaN(productNumber)) {

        return;

      }


      const barcode =
        String(productNumber)
          .padStart(3, "0");


      products[barcode] = {

        name:
          product.name,

        price:
          Number(product.price),

        stock:
          Number(product.stock)

      };

    });


    document.getElementById(
      "loading"
    ).innerHTML =

      "✅ تم تحميل المنتجات: " +
      data.length;

  }


  catch (error) {

    console.error(
      "خطأ تحميل المنتجات:",
      error
    );


    document.getElementById(
      "loading"
    ).innerHTML =

      "❌ تعذر تحميل المنتجات<br><br>" +

      error.message;

  }

}


/*
 * تحميل المنتجات عند فتح المتجر
 */

loadProducts();


/* =========================================
   تشغيل الكاميرا
========================================= */

async function startScanner() {


  if (
    Object.keys(products).length === 0
  ) {

    alert(
      "لم يتم تحميل المنتجات بعد"
    );

    return;

  }


  document.getElementById(
    "result"
  ).innerHTML =

    "📷 جاري تشغيل الكاميرا...";


  /*
   * إيقاف أي ماسح سابق
   */

  if (scanner) {

    try {

      await scanner.stop();

    }

    catch (e) {

      console.log(e);

    }

  }


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 150
      }

    },


    async function(decodedText) {


      /*
       * إضافة المنتج
       */

      addProduct(decodedText);


      /*
       * إيقاف الكاميرا
       */

      try {

        await scanner.stop();

      }

      catch (e) {

        console.log(e);

      }


      document.getElementById(
        "reader"
      ).innerHTML = "";

    },


    function(errorMessage) {

      /*
       * تجاهل أخطاء القراءة المؤقتة
       */

    }

  )


  .catch(function(error) {

    console.error(error);


    document.getElementById(
      "result"
    ).innerHTML =

      "❌ لم نستطع تشغيل الكاميرا<br><br>" +

      error;

  });

}


/* =========================================
   إضافة المنتج
========================================= */

function addProduct(barcode) {


  /*
   * قراءة الباركود كما هو.
   *
   * إذا كانت الكاميرا تقرأ:
   * 1
   *
   * نحولها إلى:
   * 001
   */

  const productNumber =
    parseInt(
      String(barcode).trim(),
      10
    );


  if (isNaN(productNumber)) {

    document.getElementById(
      "result"
    ).innerHTML =

      "❌ باركود غير صالح";

    return;

  }


  const normalizedBarcode =
    String(productNumber)
      .padStart(3, "0");


  const product =
    products[normalizedBarcode];


  if (!product) {

    document.getElementById(
      "result"
    ).innerHTML =

      "❌ هذا الباركود غير مسجل<br><br>" +

      "الباركود: " +

      normalizedBarcode;

    return;

  }


  /*
   * البحث عن المنتج في السلة
   */

  const existing =
    cart.find(function(item) {

      return (
        item.barcode ===
        normalizedBarcode
      );

    });


  if (existing) {

    existing.quantity++;

  }


  else {

    cart.push({

      barcode:
        normalizedBarcode,

      name:
        product.name,

      price:
        product.price,

      quantity:
        1

    });

  }


  document.getElementById(
    "result"
  ).innerHTML =

    "✅ تمت إضافة " +

    product.name;


  showCart();

}


/* =========================================
   حذف منتج
========================================= */

function deleteProduct(index) {

  cart.splice(
    index,
    1
  );


  showCart();

}


/* =========================================
   تغيير الكمية
========================================= */

function changeQuantity(
  index,
  amount
) {


  if (!cart[index]) {

    return;

  }


  cart[index].quantity +=
    amount;


  if (
    cart[index].quantity <= 0
  ) {

    cart.splice(
      index,
      1
    );

  }


  showCart();

}


/* =========================================
   عرض السلة
========================================= */

function showCart() {


  const container =
    document.getElementById(
      "cartItems"
    );


  if (cart.length === 0) {

    container.innerHTML =
      "لا توجد منتجات";


    document.getElementById(
      "total"
    ).innerText =
      "0";


    return;

  }


  let html = "";

  let total = 0;


  cart.forEach(
    function(item, index) {


      const itemTotal =
        item.price *
        item.quantity;


      total +=
        itemTotal;


      html += `

        <div class="item">

          <strong>
            ${item.name}
          </strong>

          <br><br>

          السعر:
          ${item.price}

          <br><br>

          الكمية:

          <button
            onclick="
              changeQuantity(
                ${index},
                -1
              )
            "
          >
            −
          </button>

          ${item.quantity}

          <button
            onclick="
              changeQuantity(
                ${index},
                1
              )
            "
          >
            +
          </button>

          <br><br>

          مجموع المنتج:
          <strong>
            ${itemTotal}
          </strong>

          <br>

          <button
            class="delete"
            onclick="
              deleteProduct(
                ${index}
              )
            "
          >
            🗑️ حذف
          </button>

        </div>

      `;

    }
  );


  container.innerHTML =
    html;


  document.getElementById(
    "total"
  ).innerText =
    total;

}


/* =========================================
   إصدار الفاتورة وحفظها
========================================= */

function createInvoice() {


  if (cart.length === 0) {

    alert(
      "السلة فارغة"
    );

    return;

  }


  /*
   * رقم الفاتورة
   */

  const invoiceNumber =
    Date.now();


  /*
   * التاريخ والوقت
   */

  const now =
    new Date();


  const date =
    now.toLocaleDateString("ar");


  const time =
    now.toLocaleTimeString("ar");


  let total = 0;

  let rows = "";


  const productNames = [];

  const quantities = [];


  /*
   * تجهيز المنتجات
   */

  cart.forEach(
    function(item) {


      const itemTotal =
        item.price *
        item.quantity;


      total +=
        itemTotal;


      productNames.push(
        item.name
      );


      quantities.push(
        item.quantity
      );


      rows += `

        <tr>

          <td>
            ${item.name}
          </td>

          <td>
            ${item.quantity}
          </td>

          <td>
            ${item.price}
          </td>

          <td>
            ${itemTotal}
          </td>

        </tr>

      `;

    }
  );


  /*
   * عرض الفاتورة أولًا
   */

  document.getElementById(
    "invoice"
  ).innerHTML = `

    <div class="invoice-box">

      <h2>
        🧾 فاتورة شراء
      </h2>


      <p>

        رقم الفاتورة:

        <strong>
          ${invoiceNumber}
        </strong>

      </p>


      <p>

        التاريخ:
        ${date}

      </p>


      <p>

        الوقت:
        ${time}

      </p>


      <table>

        <tr>

          <th>
            المنتج
          </th>

          <th>
            الكمية
          </th>

          <th>
            السعر
          </th>

          <th>
            المجموع
          </th>

        </tr>


        ${rows}

      </table>


      <h2>

        المجموع النهائي:
        ${total}

      </h2>


      <p
        id="saveStatus"
        class="status"
      >
        ⏳ جاري حفظ الفاتورة في الشيت...

      </p>


      <button
        class="print-button"
        onclick="window.print()"
      >

        🖨️ طباعة الفاتورة

      </button>


    </div>

  `;


  /*
   * تجهيز رابط الحفظ
   */

  const params =
    new URLSearchParams();


  params.append(
    "action",
    "saveInvoice"
  );


  params.append(
    "invoiceNumber",
    invoiceNumber
  );


  params.append(
    "date",
    date
  );


  params.append(
    "products",
    productNames.join("، ")
  );


  params.append(
    "quantities",
    quantities.join("، ")
  );


  params.append(
    "total",
    total
  );


  params.append(
    "time",
    time
  );


  const saveUrl =
    PRODUCTS_URL +
    "?" +
    params.toString();


  /*
   * =====================================
   * إرسال طلب الحفظ
   *
   * نستخدم iframe مخفي بدل fetch POST.
   * هذا لا يعتمد على CORS.
   * =====================================
   */

  const iframe =
    document.createElement(
      "iframe"
    );


  iframe.style.display =
    "none";


  iframe.style.width =
    "1px";


  iframe.style.height =
    "1px";


  iframe.src =
    saveUrl;


  document.body.appendChild(
    iframe
  );


  /*
   * بعد إعطاء Apps Script وقتًا للحفظ
   */

  setTimeout(
    function() {


      const status =
        document.getElementById(
          "saveStatus"
        );


      if (status) {

        status.innerHTML =

          "✅ تم إرسال الفاتورة للحفظ في الشيت";

      }


      /*
       * حذف iframe
       */

      setTimeout(
        function() {

          iframe.remove();

        },
        3000
      );


    },
    2500
  );

}


</script>


</body>

</html>
