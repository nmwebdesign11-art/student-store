<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>متجر الطلاب</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      margin: 5px;
    }

    .delete {
      background: #c62828;
    }

    .invoice-button {
      background: #1769aa;
      width: 100%;
      margin-top: 20px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      font-size: 19px;
    }

    .cart {
      margin-top: 25px;
      text-align: right;
    }

    .item {
      border-bottom: 1px solid #ddd;
      padding: 12px 5px;
    }

    .total {
      font-size: 24px;
      font-weight: bold;
      margin-top: 20px;
    }

    #invoice {
      margin-top: 25px;
      text-align: right;
    }

    .invoice-box {
      border: 2px solid #222;
      border-radius: 15px;
      padding: 20px;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    .print-button {
      width: 100%;
      margin-top: 20px;
    }

  </style>

</head>


<body>


<div class="container">

  <h1>🛒 متجر الطلاب</h1>

  <button onclick="startScanner()">
    📷 مسح الباركود
  </button>


  <div id="reader"></div>


  <div id="result">
    اضغط على زر مسح الباركود
  </div>


  <div class="cart">

    <h2>🛒 السلة</h2>


    <div id="cartItems">
      لا توجد منتجات
    </div>


    <div class="total">

      المجموع:
      <span id="total">0</span>

    </div>


    <button
      class="invoice-button"
      onclick="createInvoice()"
    >

      🧾 إصدار الفاتورة

    </button>


    <div id="invoice"></div>

  </div>

</div>


<script>


let scanner = null;


let cart = [];


const products = {

  "001": {
    name: "قلم",
    price: 5
  }

};



/* =========================
   تشغيل الكاميرا
========================= */

function startScanner() {

  document.getElementById("result").innerHTML =
    "جاري تشغيل الكاميرا...";


  scanner = new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 150
      }
    },


    function(decodedText) {

      addProduct(decodedText);


      scanner.stop();

    },


    function(errorMessage) {

      // تجاهل أخطاء القراءة المؤقتة

    }

  )


  .catch(function(error) {

    document.getElementById("result").innerHTML =

      "❌ لم نستطع تشغيل الكاميرا<br><br>" +
      error;

  });

}



/* =========================
   إضافة المنتج
========================= */

function addProduct(barcode) {

  const product = products[barcode];


  if (!product) {

    document.getElementById("result").innerHTML =

      "❌ هذا الباركود غير مسجل<br><br>" +

      "الباركود: " + barcode;

    return;

  }


  const existing = cart.find(

    item => item.barcode === barcode

  );


  if (existing) {

    existing.quantity++;

  }

  else {

    cart.push({

      barcode: barcode,

      name: product.name,

      price: product.price,

      quantity: 1

    });

  }


  document.getElementById("result").innerHTML =

    "✅ تمت إضافة " + product.name;


  showCart();

}



/* =========================
   حذف منتج
========================= */

function deleteProduct(index) {

  cart.splice(index, 1);

  showCart();

}



/* =========================
   تغيير الكمية
========================= */

function changeQuantity(index, amount) {

  cart[index].quantity += amount;


  if (cart[index].quantity <= 0) {

    cart.splice(index, 1);

  }


  showCart();

}



/* =========================
   عرض السلة
========================= */

function showCart() {

  const container =

    document.getElementById("cartItems");


  if (cart.length === 0) {

    container.innerHTML =
      "لا توجد منتجات";


    document.getElementById("total").innerText =
      "0";


    return;

  }


  let html = "";


  let total = 0;


  cart.forEach(function(item, index) {


    const itemTotal =

      item.price * item.quantity;


    total += itemTotal;


    html += `

      <div class="item">

        <strong>
          ${item.name}
        </strong>

        <br><br>

        السعر:
        ${item.price}

        <br><br>

        الكمية:

        <button
          onclick="changeQuantity(${index}, -1)"
        >
          −
        </button>

        ${item.quantity}

        <button
          onclick="changeQuantity(${index}, 1)"
        >
          +
        </button>

        <br><br>

        مجموع المنتج:
        ${itemTotal}

        <br>

        <button
          class="delete"
          onclick="deleteProduct(${index})"
        >

          🗑️ حذف

        </button>

      </div>

    `;

  });


  container.innerHTML = html;


  document.getElementById("total").innerText =
    total;

}



/* =========================
   إصدار الفاتورة
========================= */

function createInvoice() {


  if (cart.length === 0) {

    alert("السلة فارغة");

    return;

  }


  const invoiceNumber =

    Date.now();


  const date =

    new Date().toLocaleString("ar");


  let total = 0;


  let rows = "";


  cart.forEach(function(item) {


    const itemTotal =

      item.price * item.quantity;


    total += itemTotal;


    rows += `

      <tr>

        <td>
          ${item.name}
        </td>

        <td>
          ${item.quantity}
        </td>

        <td>
          ${item.price}
        </td>

        <td>
          ${itemTotal}
        </td>

      </tr>

    `;

  });


  document.getElementById("invoice").innerHTML = `

    <div class="invoice-box">

      <h2>
        🧾 فاتورة شراء
      </h2>


      <p>

        رقم الفاتورة:

        <strong>
          ${invoiceNumber}
        </strong>

      </p>


      <p>

        التاريخ:

        ${date}

      </p>


      <table>

        <tr>

          <th>
            المنتج
          </th>

          <th>
            الكمية
          </th>

          <th>
            السعر
          </th>

          <th>
            المجموع
          </th>

        </tr>

        ${rows}

      </table>


      <h2>

        المجموع النهائي:
        ${total}

      </h2>


      <button
        class="print-button"
        onclick="window.print()"
      >

        🖨️ طباعة الفاتورة

      </button>

    </div>

  `;

}


</script>


</body>

</html>
