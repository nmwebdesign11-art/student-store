<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>باركود المنتجات</title>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 30px;
    }

    .product {
      border: 2px solid #ddd;
      border-radius: 15px;
      padding: 20px;
      max-width: 400px;
      margin: auto;
    }

    svg {
      width: 100%;
      max-width: 350px;
    }
  </style>
</head>

<body>

  <div class="product">

    <h1>📦 المنتج</h1>

    <h2>قلم</h2>

    <p>السعر: 5</p>

    <svg id="barcode"></svg>

  </div>

  <script>
    JsBarcode("#barcode", "001", {
      format: "CODE128",
      displayValue: true,
      fontSize: 22,
      height: 100,
      margin: 20
    });
  </script>

</body>
</html>
